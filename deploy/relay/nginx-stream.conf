# Public relay (a cheap VPS that owns the DNS record). TLS is NOT terminated here:
# the raw TCP stream is forwarded through WireGuard to the origin, which holds the
# certificate and private key. The relay therefore sees only encrypted bytes, and the
# origin's real IP never appears in DNS, certificates, or response headers.
#
# Place at the top level of nginx.conf (next to http {}), not inside http {}.
# No access log: the relay does not record visitor addresses either.
stream {
    access_log off;
    error_log /var/log/nginx/relay-error.log crit;

    upstream origin_https { server 10.77.0.2:443; }
    upstream origin_http  { server 10.77.0.2:80; }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass origin_https;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }
    server {
        listen 80;
        listen [::]:80;
        proxy_pass origin_http;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
