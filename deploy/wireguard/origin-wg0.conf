# /etc/wireguard/wg0.conf on the ORIGIN
[Interface]
Address = 10.77.0.2/24
PrivateKey = <origin-private-key>

[Peer]
# relay
PublicKey = <relay-public-key>
PresharedKey = <preshared-key>
Endpoint = <relay-public-ip>:51820
AllowedIPs = 10.77.0.1/32
PersistentKeepalive = 25                # origin dials out, so it needs no open inbound port
