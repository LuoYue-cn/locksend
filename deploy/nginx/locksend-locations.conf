# Shared location rules (included by both the production server block and the
# local test server). Expects $document_root to be server/public and the PHP
# backend to be reachable through upstream "ls_php".

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/locksend-headers.conf;
}

location ^~ /s/ {
    # Share pages are one static shell; the share id is read client-side.
    try_files /s.html =404;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/locksend-headers.conf;
}

location = /admin {
    try_files /admin.html =404;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/locksend-headers.conf;
}

location = /security.html { add_header Cache-Control "no-cache" always; include /etc/nginx/locksend-headers.conf; }
location = /build-manifest.json { add_header Cache-Control "no-cache" always; include /etc/nginx/locksend-headers.conf; }

# Content-hashed bundles never change under the same name.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/locksend-headers.conf;
    try_files $uri =404;
}

location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/locksend-headers.conf;
}

# The install page is served by PHP, which stops serving it (404) once installed.
location = /install {
    include /etc/nginx/locksend-fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
}

location ^~ /api/ {
    limit_req zone=ls_api burst=60 nodelay;
    include /etc/nginx/locksend-fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param REQUEST_URI $request_uri;
}

# Ciphertext chunks are streamed by nginx itself after PHP authorised the request
# (X-Accel-Redirect). Not reachable directly.
location ^~ /_blobs/ {
    internal;
    alias /var/lib/locksend/blobs/;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Everything else (including *.php, dotfiles, source, vendor, data) is a 404.
location / { return 404; }
