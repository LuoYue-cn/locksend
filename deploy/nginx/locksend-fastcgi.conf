fastcgi_pass ls_php;
include fastcgi_params;
fastcgi_param LOCKSEND_DATA_DIR      /var/lib/locksend;
fastcgi_param LOCKSEND_ACCEL_PREFIX  /_blobs;
fastcgi_param LOCKSEND_REDIS         unix:///run/redis/locksend.sock;
fastcgi_param LOCKSEND_TRUST_REAL_IP 0;
fastcgi_read_timeout 60s;
fastcgi_send_timeout 60s;
# Never forward the visitor address as a header the app could log.
fastcgi_param HTTP_X_REAL_IP "";
fastcgi_param HTTP_X_FORWARDED_FOR "";
