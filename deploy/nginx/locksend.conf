# LockSend site configuration (include inside http {}).
# Production: TLS 1.3 only. No access log: visitor addresses are never written to disk.

# Per-address request limiting happens in nginx memory only (not logged, not persisted).
limit_req_zone $binary_remote_addr zone=ls_api:5m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ls_chunk:5m rate=20r/s;

upstream ls_php {
    server unix:/run/php/locksend.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.invalid;   # replace with your domain

    access_log off;
    error_log  /var/log/nginx/locksend-error.log warn;

    # ---- TLS 1.3 only -------------------------------------------------------
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_certificate     /etc/ssl/locksend/fullchain.pem;
    ssl_certificate_key /etc/ssl/locksend/privkey.pem;
    ssl_session_tickets off;
    ssl_session_timeout 10m;
    ssl_session_cache shared:ls_ssl:5m;

    # ---- hardening headers (also applied to error pages) ---------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/locksend/server/public;
    index index.html;
    client_max_body_size 5m;      # one ciphertext chunk is 4 MiB + 16 bytes
    client_body_timeout 60s;

    include /etc/nginx/locksend-locations.conf;
}
