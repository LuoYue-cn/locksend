# Memory-only Redis: no RDB snapshots, no AOF. Holds rate-limit counters, sessions, download progress.
bind 127.0.0.1 -::1
port 0
unixsocket /run/redis/locksend.sock
unixsocketperm 770
save ""
appendonly no
maxmemory 128mb
maxmemory-policy volatile-ttl
protected-mode yes
# Do not log client addresses or commands.
loglevel warning
