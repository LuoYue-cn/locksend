; PHP-FPM pool for LockSend. Runs as www-data; only nginx can reach the socket.
[locksend]
user = www-data
group = www-data
listen = /run/php/locksend.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; No access log: the pool never records visitor addresses.
access.log = /dev/null
catch_workers_output = no
clear_env = yes

; Secrets come from the environment (not the database). Keep this file 0640 root:www-data.
; The value MUST be quoted: base64 padding ('=') breaks the pool parser otherwise.
; env[LOCKSEND_PEPPER] = "base64:REPLACE_WITH_32_RANDOM_BYTES"
env[LOCKSEND_DATA_DIR] = /var/lib/locksend
env[LOCKSEND_REDIS] = unix:///run/redis/locksend.sock
env[LOCKSEND_ACCEL_PREFIX] = /_blobs

php_admin_value[display_errors] = 0
php_admin_value[log_errors] = 1
php_admin_value[error_log] = /var/log/php-locksend-error.log
php_admin_value[expose_php] = 0
php_admin_value[open_basedir] = /var/www/locksend/server:/var/lib/locksend:/tmp
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 5M
php_admin_value[memory_limit] = 64M
php_admin_value[session.auto_start] = 0
php_admin_value[opcache.validate_timestamps] = 0
