# Reference stack: nginx -> php-fpm -> memory-only redis. Terminate TLS 1.3 in front of it (see docs/DEPLOY.md),
# or mount certificates and use deploy/nginx/locksend.conf instead of the plain-HTTP test config below.
services:
  php:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      LOCKSEND_DATA_DIR: /var/lib/locksend
      LOCKSEND_REDIS: tcp://redis:6379
      LOCKSEND_ACCEL_PREFIX: /_blobs
      LOCKSEND_PEPPER: ${LOCKSEND_PEPPER:?set LOCKSEND_PEPPER (base64:... of 32 random bytes)}
    volumes:
      - data:/var/lib/locksend
      - public:/var/www/locksend/server/public
    depends_on: [redis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx/docker-site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/locksend-locations.conf:/etc/nginx/locksend-locations.conf:ro
      - ./deploy/nginx/locksend-headers.conf:/etc/nginx/locksend-headers.conf:ro
      - ./deploy/nginx/docker-fastcgi.conf:/etc/nginx/locksend-fastcgi.conf:ro
      - public:/var/www/locksend/server/public:ro
      - data:/var/lib/locksend:ro
    depends_on: [php]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl", "--loglevel", "warning"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  data:
  public:
